<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API CEP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            color: #1a1a1a;
            background: #f5f4f0;
            padding: 2rem;
            min-height: 100vh;
        }

        h1 {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 0.5px solid #ddd;
        }

        .section {
            background: #fff;
            border: 0.5px solid #e0e0e0;
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1rem;
        }

        h2 {
            font-size: 13px;
            font-weight: 500;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 1rem;
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        input[type="text"] {
            flex: 1;
            height: 36px;
            padding: 0 12px;
            border: 0.5px solid #ddd;
            border-radius: 8px;
            background: #f9f9f7;
            color: #1a1a1a;
            font-size: 14px;
            outline: none;
            transition: border-color .15s;
        }

        input[type="text"]:focus {
            border-color: #aaa;
        }

        input[readonly] {
            color: #999;
        }

        button {
            height: 36px;
            padding: 0 16px;
            border: 0.5px solid #ccc;
            border-radius: 8px;
            background: transparent;
            color: #1a1a1a;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s;
        }

        button:hover {
            background: #f5f4f0;
        }

        button:active {
            transform: scale(.98);
        }

        .fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .fields input {
            flex: unset;
        }

        .response-block h2 {
            margin-bottom: .5rem;
        }

        pre {
            background: #f9f9f7;
            border: 0.5px solid #e0e0e0;
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #666;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 48px;
        }
    </style>
</head>
<body>

<h1>API de CEP</h1>

<div class="section">
    <h2>GET — consultar CEP</h2>
    <div class="row">
        <input type="text" id="get-cep" placeholder="Digite o CEP">
        <button onclick="buscarCep()">Buscar</button>
    </div>
</div>

<div class="section">
    <h2>POST — cadastrar CEP</h2>
    <div class="row">
        <input type="text" id="post-cep" placeholder="CEP">
        <button onclick="preencherViaCep()">Buscar via ViaCEP</button>
    </div>
    <div class="fields">
        <input type="text" id="post-logradouro" placeholder="Logradouro">
        <input type="text" id="post-bairro" placeholder="Bairro">
        <input type="text" id="post-cidade" placeholder="Cidade">
        <input type="text" id="post-estado" placeholder="Estado">
        <input type="text" id="post-pais" placeholder="País">
    </div>
    <button onclick="cadastrarCep()">Cadastrar</button>
</div>

<div class="section">
    <h2>PUT — atualizar CEP</h2>
    <div class="fields">
        <input type="text" id="put-cep" placeholder="CEP" >
        <input type="text" id="put-logradouro" placeholder="Logradouro">
        <input type="text" id="put-bairro" placeholder="Bairro">
        <input type="text" id="put-cidade" placeholder="Cidade">
        <input type="text" id="put-estado" placeholder="Estado">
        <input type="text" id="put-pais" placeholder="País">
    </div>
    <button onclick="atualizarCep()">Atualizar</button>
</div>

<div class="section">
    <h2>DELETE — remover CEP</h2>
    <div class="row">
        <input type="text" id="delete-cep" placeholder="Digite o CEP">
        <button onclick="removerCep()">Remover</button>
    </div>
</div>

<div class="section response-block">
    <h2>Resposta</h2>
    <pre id="resposta">—</pre>
</div>

<script>
    const API = 'api/cep.php';

    async function buscarCep() {
        const cep = document.getElementById('get-cep').value;
        const res = await fetch(API + '?cep=' + cep);
        const dados = await res.json();
        document.getElementById('resposta').textContent = JSON.stringify(dados, null, 2);
    }

    async function preencherViaCep() {
        const cep = document.getElementById('post-cep').value;
        const res = await fetch('https://viacep.com.br/ws/' + cep + '/json/');
        const dados = await res.json();

        document.getElementById('post-logradouro').value = dados.logradouro;
        document.getElementById('post-bairro').value     = dados.bairro;
        document.getElementById('post-cidade').value     = dados.localidade;
        document.getElementById('post-estado').value     = dados.uf;
        document.getElementById('post-pais').value       = 'Brasil';
    }

    async function cadastrarCep() {
        const body = {
            cep:        document.getElementById('post-cep').value,
            logradouro: document.getElementById('post-logradouro').value,
            bairro:     document.getElementById('post-bairro').value,
            cidade:     document.getElementById('post-cidade').value,
            estado:     document.getElementById('post-estado').value,
            pais:       document.getElementById('post-pais').value
        };
        const res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const dados = await res.json();
        document.getElementById('resposta').textContent = JSON.stringify(dados, null, 2);
    }

    async function atualizarCep() {
        const body = {
            cep:        document.getElementById('put-cep').value,
            logradouro: document.getElementById('put-logradouro').value,
            bairro:     document.getElementById('put-bairro').value,
            cidade:     document.getElementById('put-cidade').value,
            estado:     document.getElementById('put-estado').value,
            pais:       document.getElementById('put-pais').value
        };
        const res = await fetch(API, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const dados = await res.json();
        document.getElementById('resposta').textContent = JSON.stringify(dados, null, 2);
    }

    async function removerCep() {
        const cep = document.getElementById('delete-cep').value;
        const res = await fetch(API + '?cep=' + cep, { method: 'DELETE' });
        const dados = await res.json();
        document.getElementById('resposta').textContent = JSON.stringify(dados, null, 2);
    }
</script>

</body>
</html>
